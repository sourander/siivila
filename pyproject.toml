[project]
name = "siivila"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jani Sourander", email = "jani.sourander@kamk.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
grade = "siivila.cli:main"

[project.optional-dependencies]
observability = [
    "langfuse>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlx-lm>=0.32.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
